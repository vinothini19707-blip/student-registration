<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Student Registration System</h1>
            <p>Manage student information easily</p>
        </div>
    </header>

    <main class="container">

        <!-- Dashboard Statistics -->

        <section class="stats">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Departments</h3>
                <p id="totalDepartments">0</p>
            </div>
        </section>

        <!-- Registration Form -->

        <section class="form-section">

            <h2 id="formTitle">Student Registration Form</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="input-group full-width">
                        <label>Student Profile Photo</label>
                        <input
                            type="file"
                            id="photo"
                            accept="image/*"
                        >
                        <img
                            id="photoPreview"
                            class="photo-preview"
                            alt="Student photo preview"
                        >
                    </div>

                    <div class="input-group">
                        <label>Student ID</label>
                        <input
                            type="text"
                            id="studentId"
                            placeholder="Enter student ID"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Roll Number</label>
                        <input
                            type="text"
                            id="rollNo"
                            placeholder="Enter roll number"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Date of Birth</label>
                        <input
                            type="date"
                            id="dob"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                            <option>Prefer not to say</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="example@gmail.com"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Mobile Number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="10 digit mobile number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="CSE">Computer Science</option>
                            <option value="IT">Information Technology</option>
                            <option value="ECE">Electronics</option>
                            <option value="EEE">Electrical</option>
                            <option value="MECH">Mechanical</option>
                            <option value="CIVIL">Civil</option>
                            <option value="AI & DS">AI & Data Science</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Academic Year</label>
                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <label>Address</label>
                        <textarea
                            id="address"
                            placeholder="Enter student address"
                            rows="3"
                            required
                        ></textarea>
                    </div>

                </div>

                <div class="buttons">

                    <button type="submit" id="submitBtn">
                        Register Student
                    </button>

                    <button type="reset" class="reset-btn">
                        Clear Form
                    </button>

                </div>

            </form>

        </section>

        <!-- Student Records -->

        <section class="records-section">

            <div class="records-heading">
                <h2>Registered Students</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by name, ID or roll number..."
                >
            </div>

            <div id="studentContainer" class="student-grid">
            </div>

            <p id="emptyMessage">
                No students registered yet.
            </p>

        </section>

    </main>

    <footer>
        <p>Student Registration System © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
